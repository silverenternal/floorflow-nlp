[project]
name = "newera"
version = "0.1.0"
description = "Structured NLP and code-generation research"
readme = "project/README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
    "tree-sitter==0.26.0",
    "tree-sitter-python==0.25.0",
    "tree-sitter-rust==0.24.2",
    "tree-sitter-cpp==0.23.4",
    "torch-geometric>=2.8,<3",
]

[project.scripts]
newera-gate = "newera.gates.__main__:main"

[project.optional-dependencies]
pretrained = [
    "transformers>=4.57",
    "tokenizers>=0.22",
]
dev = [
    "psutil>=7.0",
    "pytest>=8.0",
    "ruff>=0.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["newera*"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["project/tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
